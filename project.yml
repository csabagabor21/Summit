name: Summit
options:
  bundleIdPrefix: hu.flint.app
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
# Realtime szinkron: FirebaseFirestore SPM-csomag (rest-pull helyett
# snapshot-listener a sync docra). Exact pin — reprodukálható build.
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 12.19.2
targets:
  Summit:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # Live Activity háttér-ébresztés (BGAppRefreshTask): óra/szünet végén
    # az app megnyitása nélkül is átkapcsol az activity.
    postBuildScripts:
      - name: Inject plist keys (BG refresh + Handoff)
        script: |
          # Tömb típusú plist-kulcsokat az INFOPLIST_KEY_* build settingek nem
          # tudnak (csak stringet) — ezért injektáljuk a legenerált
          # Info.plist-be. plutil -insert atomi: mindig a pontos típust írja.
          # A PlistBuddy Delete/Add páros TILOS (egyszer már Dict-té fajult
          # egy kulcs: Dict{0=fetch} → App Store upload-hiba).
          # Az aláírás ezután történik, így App Store / TestFlight buildeken
          # is érvényes marad.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # Handoff (Continuity, "hu.flint.view"): a tevékenység-típust az
          # Info.plist-ben deklarálni kell (NSUserActivityTypes) — iOS-en ÉS
          # Catalyst-Macen is, különben a másik eszköz nem tudja folytatni.
          /usr/bin/plutil -remove NSUserActivityTypes "$PLIST" 2>/dev/null || true
          /usr/bin/plutil -insert NSUserActivityTypes -json '["hu.flint.view"]' "$PLIST"
          # Mac Catalyst builden az iOS háttér-kulcsok nem kellenek — eddig.
          case "${EFFECTIVE_PLATFORM_NAME:-}" in *maccatalyst*) exit 0;; esac
          # A BGAppRefreshTask két tömb típusú plist-kulcsot igényel (lásd fent).
          /usr/bin/plutil -remove UIBackgroundModes "$PLIST" 2>/dev/null || true
          /usr/bin/plutil -insert UIBackgroundModes -json '["fetch"]' "$PLIST"
          /usr/bin/plutil -remove BGTaskSchedulerPermittedIdentifiers "$PLIST" 2>/dev/null || true
          /usr/bin/plutil -insert BGTaskSchedulerPermittedIdentifiers -json '["hu.flint.app.Flint.liveactivity-refresh"]' "$PLIST"
          # Hangos ellenőrzés: rossz típus már a buildet buktassa, ne az uploadot.
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | head -1 | grep -q "^Array"; then
            echo "error: UIBackgroundModes nem array a generált Info.plist-ben ($PLIST)"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :NSUserActivityTypes" "$PLIST" 2>/dev/null | head -1 | grep -q "^Array"; then
            echo "error: NSUserActivityTypes nem array a generált Info.plist-ben ($PLIST)"
            exit 1
          fi
    sources:
      - path: FirkaNative
        excludes:
          - "LiveActivity/SummitLiveActivityWidget.swift"
    resources:
      # FIGYELEM: az xcodegen 2.46 regen kidobja az AppIcon.icon-t a pbxproj-ból
      # (nem ismeri az .icon csomagot) — regen után kézzel vissza kell tenni
      # (a 95CE7EB3/95CE7EB4 sorokat: BuildFile, FileReference, group, Resources).
      - path: AppIcon.icon
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "2"
        # Firebase SPM statikus linkelés: az ObjC-kategóriákat a linker
        # különben leszedheti → runtime crash. (Ld. pbxproj OTHER_LDFLAGS.)
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # Automatikus aláírás (Xcode-managed profilok). A kézi profilok
        # (csabav5 / csabamacoldja / widetv3 / widetmacc) nem állták ki az
        # archive-ot, ezért az Xcode-ban kézzel Automatic-ra lett állítva —
        # ez van itt visszakódolva, hogy a regen ne verje szét.
        # Catalyst: ugyanaz a Bundle ID, egy TestFlight app — az iPad-es
        # "Designed for iPad" mód KI, helyette natív Catalyst build megy fel.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 38DAVMRN66
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Summit"
        INFOPLIST_KEY_CFBundleName: "Summit"
        # Mac App Store (Catalyst) feltöltéshez kötelező kategória —
        # enélkül "The product archive is invalid ... LSApplicationCategoryType".
        # Csak macosx-SDK kapja, az iOS plist változatlan marad.
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.education
        # Export compliance (TestFlight): az app nem használ nem-mentesített
        # titkosítást (csak rendszer-HTTPS) — ezzel nem kell buildenként
        # kitölteni az "App Encryption Documentation" kérdőívet.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Profilkép beállításához hozzáférés a fotókönyvtárhoz szükséges."
        INFOPLIST_KEY_NSCameraUsageDescription: "Profilkép készítéséhez kamera hozzáférés szükséges."
      configs:
        # Push entitlements konfigonként: Debug = development, Release = production.
        # Regen-biztos: enélkül az xcodegen eldobná az aps-environmentet,
        # és a TestFlight build újra push nélkül futna.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Summit.entitlements
          # Automatic módban a Debug development-identitással ír alá
          # (van get-task-allow), így a debugger Mac-en (Catalyst) is
          # kapcsolódik — nincs szükség aláírás-kikapcsolásra.
        Release:
          CODE_SIGN_ENTITLEMENTS: SummitRelease.entitlements
          # Mac App Store (Catalyst) feltöltés: sandbox + network.client
          # kötelező ("App sandbox not enabled"). Külön fájl, mert az iOS
          # profilokban (csabav5) ez a kulcs nincs benne — oda nem kerülhet.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SummitReleaseMac.entitlements
    dependencies:
      - target: SummitWidgets
      # Óra-app beágyazás ("Embed Watch Content"). Csak iOS-re szűrve,
      # különben a Mac (Catalyst) build is beágyazná és elbukna.
      - target: SummitWatch
        platformFilter: iOS
      # Csak a Firestore-product (a tranzitív függőségeket az SPM hozza).
      - package: firebase-ios-sdk
        products: [FirebaseFirestore]
  SummitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    # Az extension bundle ID-nak a fő app ID-jával kell kezdődnie, különben
    # telepítéskor "App Extensions must be prefixed..." hiba jön. Az xcodegen
    # a target nevéből generálna (hu.flint.app.SummitWidgets — rossz), ezért
    # itt explicit felülírjuk. (A régi `bundleId:` kulcsot nem ismeri, törölve.)
    info:
      path: SummitWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - SummitWidgets
      - path: FirkaNative/LiveActivity/SummitLiveActivityAttributes.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetSnapshot.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetLogic.swift
      - path: FirkaNative/Core/Stats/VacationCountdown.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Automatikus aláírás, mint a fő appnál (az Xcode-ban kézzel
        # átállított működő setup visszakódolva — ld. a fő target kommentjét).
        # A Catalyst Mac buildbe is beágyazódik a widget, ezért az extension
        # is kap Catalyst-támogatást (Live Activity widget Mac-en nincs).
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 38DAVMRN66
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint.Widgets
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: SummitWidgets.entitlements
        # Mac (Catalyst) feltöltés: a widgetbe is kell a sandbox-kulcs.
        # Külön fájl, ugyanazért, mint a fő appnál.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SummitWidgetsMac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Summit Widgets"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
      configs:
        Debug:
          # Automatic módban nincs szükség aláírás-kikapcsolásra
          # (development-identitás, mint a fő appnál).
          CODE_SIGN_ENTITLEMENTS: SummitWidgets.entitlements
  SummitWatchWidgets:
    type: app-extension
    platform: watchOS
    # watchOS 10 a Smart Stack-widgetek minimuma — Series 4-től települ
    # (a .glassEffect 26-os, arra a WatchGlass.swift ad fallbackot).
    deploymentTarget: "10.0"
    info:
      path: SummitWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - SummitWatchWidgets
      # Shared fájlok framework nélkül — az óra app-pal közösen fordítva
      # (minta: TimetableWidgetStore az iOS widgetnél).
      - path: FirkaNative/Core/Storage/TimetableWidgetSnapshot.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetLogic.swift
      - path: FirkaNative/Core/Watch/WatchPayload.swift
      - path: FirkaNative/Core/Models/KretaModels.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "2"
        # Az extension bundle ID-nak az óra app ID-jával kell kezdődnie
        # (mint iOS-en: a widget a fő app prefixét viseli).
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint.watchapp.Widgets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 38DAVMRN66
        PROVISIONING_PROFILE_SPECIFIER: ""
        # App Group a Smart Stack-widgettel közös gyorsítótárhoz
        # (WatchSharedStore) — nélküle a widget üreset mutat.
        CODE_SIGN_ENTITLEMENTS: SummitWatchWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Summit Most"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  SummitWatch:
    type: application
    platform: watchOS
    # watchOS 10-től települ (Series 4+) — a Smart Stack-widgettel együtt
    # a legacy órák is kapnak appot + widgetet (glass-fallbackkal).
    deploymentTarget: "10.0"
    info:
      path: SummitWatch/Info.plist
    sources:
      - SummitWatch
      # Shared fájlok framework nélkül — mindkét target fordítja
      # (minta: TimetableWidgetStore a widgetnél).
      - path: FirkaNative/Core/Watch/WatchPayload.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetSnapshot.swift
      - path: FirkaNative/Core/Models/GradingLogic.swift
      - path: FirkaNative/Core/Models/KretaModels.swift
      - path: FirkaNative/Core/Theme/AppColors.swift
    dependencies:
      # Smart Stack widget beágyazás ("Embed App Extensions").
      - target: SummitWatchWidgets
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint.watchapp
        # Automatikus aláírás, mint a fő appnál — külön watch-profil
        # nem kell a portálon, az Xcode menedzseli (az Xcode-ban kézzel
        # átállított működő setup visszakódolva).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 38DAVMRN66
        PROVISIONING_PROFILE_SPECIFIER: ""
        # App Group a Smart Stack-widgettel közös gyorsítótárhoz
        # (WatchSharedStore) — nélküle a widget üreset mutat.
        CODE_SIGN_ENTITLEMENTS: SummitWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Óra-ikon: a SummitWatch/WatchAppIcon.icon IconComposer-asset
        # (kör-maszkhoz igazított hegy, az iPhone-ikon kistestvére).
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Summit"
        INFOPLIST_KEY_CFBundleName: "Summit"
        # Nincs nem-mentesített titkosítás (csak rendszer-HTTPS WC-n át).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # A companion-azonosító CSAK innen kerül a generált plistbe —
        # az Info.plist fájl WK-kulcsait a GENERATE_INFOPLIST_FILE
        # elnyomja, enélkül a telepítés elutasítja a beágyazott órát.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: hu.flint
# FIGYELEM: a SummitUITests UI-teszt target KÉZZEL van a pbxproj-ban
# (az xcodegen 2.46 nem ismer ui-test-bundle típust) — regen ELVISZI,
# utána újra hozzá kell adni (lásd a commitot, ami bevezette).
# Megosztott scheme az óra-app közvetlen futtatásához (Xcode Run az
# órára — a scheme a repó része, nem user-lokális).
schemes:
  SummitWatch:
    build:
      targets:
        SummitWatch: all
    run:
      config: Debug
