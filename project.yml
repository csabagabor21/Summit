name: Summit
options:
  bundleIdPrefix: hu.flint.app
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
# Realtime szinkron: FirebaseFirestore SPM-csomag (rest-pull helyett
# snapshot-listener a sync docra). Exact pin — reprodukálható build.
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 12.19.2
targets:
  Summit:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # Live Activity háttér-ébresztés (BGAppRefreshTask): óra/szünet végén
    # az app megnyitása nélkül is átkapcsol az activity.
    postBuildScripts:
      - name: Inject background refresh plist keys
        script: |
          # Mac Catalyst builden az iOS háttér-kulcsok nem kellenek — kihagyjuk.
          case "${EFFECTIVE_PLATFORM_NAME:-}" in *maccatalyst*) exit 0;; esac
          # A BGAppRefreshTask két tömb típusú plist-kulcsot igényel, amit az
          # INFOPLIST_KEY_* build settingek nem tudnak (csak stringet) — ezért
          # injektáljuk a legenerált Info.plist-be. plutil -insert atomi: mindig
          # a pontos típust írja. A PlistBuddy Delete/Add páros TILOS (egyszer
          # már Dict-té fajult a kulcs: Dict{0=fetch} → App Store upload-hiba).
          # Az aláírás ezután történik, így App Store / TestFlight buildeken
          # is érvényes marad.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/bin/plutil -remove UIBackgroundModes "$PLIST" 2>/dev/null || true
          /usr/bin/plutil -insert UIBackgroundModes -json '["fetch"]' "$PLIST"
          /usr/bin/plutil -remove BGTaskSchedulerPermittedIdentifiers "$PLIST" 2>/dev/null || true
          /usr/bin/plutil -insert BGTaskSchedulerPermittedIdentifiers -json '["hu.flint.app.Flint.liveactivity-refresh"]' "$PLIST"
          # Hangos ellenőrzés: rossz típus már a buildet buktassa, ne az uploadot.
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | head -1 | grep -q "^Array"; then
            echo "error: UIBackgroundModes nem array a generált Info.plist-ben ($PLIST)"
            exit 1
          fi
    sources:
      - path: FirkaNative
        excludes:
          - "LiveActivity/SummitLiveActivityWidget.swift"
    resources:
      # FIGYELEM: az xcodegen 2.46 regen kidobja az AppIcon.icon-t a pbxproj-ból
      # (nem ismeri az .icon csomagot) — regen után kézzel vissza kell tenni
      # (a 95CE7EB3/95CE7EB4 sorokat: BuildFile, FileReference, group, Resources).
      - path: AppIcon.icon
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        # Firebase SPM statikus linkelés: az ObjC-kategóriákat a linker
        # különben leszedheti → runtime crash. (Ld. pbxproj OTHER_LDFLAGS.)
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # Kézi aláírás a pbxproj-val egyezően (TestFlight: csabav5 profil).
        # Az [sdk=iphoneos*] kulcs csak eszköz-builden él — szimulátoron üres.
        # Catalyst: ugyanaz a Bundle ID, egy TestFlight app — az iPad-es
        # "Designed for iPad" mód KI, helyette natív Catalyst build megy fel.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Developer"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Distribution"
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 38DAVMRN66
        # Mac (Catalyst) aláírás: korábban kézi sor a pbxproj-ban —
        # regen-biztosan itt (különben a regen eldobná).
        "DEVELOPMENT_TEAM[sdk=macosx*]": 38DAVMRN66
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": csabav5
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": csabav5
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Summit"
        INFOPLIST_KEY_CFBundleName: "Summit"
        # Export compliance (TestFlight): az app nem használ nem-mentesített
        # titkosítást (csak rendszer-HTTPS) — ezzel nem kell buildenként
        # kitölteni az "App Encryption Documentation" kérdőívet.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Profilkép beállításához hozzáférés a fotókönyvtárhoz szükséges."
        INFOPLIST_KEY_NSCameraUsageDescription: "Profilkép készítéséhez kamera hozzáférés szükséges."
      configs:
        # Push entitlements konfigonként: Debug = development, Release = production.
        # Regen-biztos: enélkül az xcodegen eldobná az aps-environmentet,
        # és a TestFlight build újra push nélkül futna.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Summit.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SummitRelease.entitlements
    dependencies:
      - target: SummitWidgets
      # Óra-app beágyazás ("Embed Watch Content"). Csak iOS-re szűrve,
      # különben a Mac (Catalyst) build is beágyazná és elbukna.
      - target: SummitWatch
        platformFilter: iOS
      # Csak a Firestore-product (a tranzitív függőségeket az SPM hozza).
      - package: firebase-ios-sdk
        products: [FirebaseFirestore]
  SummitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    # Az extension bundle ID-nak a fő app ID-jával kell kezdődnie, különben
    # telepítéskor "App Extensions must be prefixed..." hiba jön. Az xcodegen
    # a target nevéből generálna (hu.flint.app.SummitWidgets — rossz), ezért
    # itt explicit felülírjuk. (A régi `bundleId:` kulcsot nem ismeri, törölve.)
    info:
      path: SummitWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - SummitWidgets
      - path: FirkaNative/LiveActivity/SummitLiveActivityAttributes.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetSnapshot.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetLogic.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Kézi aláírás, mint a fő appnál (TestFlight: widetv3 profil).
        # Az [sdk=iphoneos*] kulcs csak eszköz-builden él — szimulátoron üres.
        # A Catalyst Mac buildbe is beágyazódik a widget, ezért az extension
        # is kap Catalyst-támogatást (Live Activity widget Mac-en nincs).
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Developer"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Distribution"
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 38DAVMRN66
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint.Widgets
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": widetv3
        CODE_SIGN_ENTITLEMENTS: SummitWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Summit Widgets"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  SummitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    info:
      path: SummitWatch/Info.plist
    sources:
      - SummitWatch
      # Shared fájlok framework nélkül — mindkét target fordítja
      # (minta: TimetableWidgetStore a widgetnél).
      - path: FirkaNative/Core/Watch/WatchPayload.swift
      - path: FirkaNative/Core/Storage/TimetableWidgetSnapshot.swift
      - path: FirkaNative/Core/Models/GradingLogic.swift
      - path: FirkaNative/Core/Models/KretaModels.swift
      - path: FirkaNative/Core/Theme/AppColors.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        PRODUCT_BUNDLE_IDENTIFIER: hu.flint.watch
        # Kézi aláírás, mint a fő appnál. Eszköz/TestFlight buildhez a
        # portálon külön watch-profil kell (hu.flint.watch) — amíg nincs,
        # csak szimulátor-build megy.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Developer"
        "CODE_SIGN_IDENTITY[sdk=watchos*]": "iPhone Distribution"
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=watchos*]": 38DAVMRN66
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: YES
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        # Óra-ikon: a SummitWatch/WatchAppIcon.icon IconComposer-asset
        # (kör-maszkhoz igazított hegy, az iPhone-ikon kistestvére).
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Summit"
        INFOPLIST_KEY_CFBundleName: "Summit"
        # Nincs nem-mentesített titkosítás (csak rendszer-HTTPS WC-n át).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # A companion-azonosító CSAK innen kerül a generált plistbe —
        # az Info.plist fájl WK-kulcsait a GENERATE_INFOPLIST_FILE
        # elnyomja, enélkül a telepítés elutasítja a beágyazott órát.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: hu.flint
# Megosztott scheme az óra-app közvetlen futtatásához (Xcode Run az
# órára — a scheme a repó része, nem user-lokális).
schemes:
  SummitWatch:
    build:
      targets:
        SummitWatch: all
    run:
      config: Debug
