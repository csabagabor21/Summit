name: Flint
options:
  bundleIdPrefix: hu.flint.app
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
targets:
  Flint:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FirkaNative
        excludes:
          - "LiveActivity/FlintLiveActivityWidget.swift"
    resources:
      - path: AppIcon.icon
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PPZB956QW6
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Flint"
        INFOPLIST_KEY_CFBundleName: "Flint"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Profilkép beállításához hozzáférés a fotókönyvtárhoz szükséges."
        INFOPLIST_KEY_NSCameraUsageDescription: "Profilkép készítéséhez kamera hozzáférés szükséges."
    dependencies:
      - target: FlintWidgets
  FlintWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: hu.flint.app.Flint.Widgets
    info:
      path: FlintWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - FlintWidgets
      - path: FirkaNative/LiveActivity/FlintLiveActivityAttributes.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PPZB956QW6
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Flint Widgets"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
