		1BE0609A0110A58FB875FFC1 /* Inject plist keys (BG refresh + Handoff) */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
